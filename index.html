<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Управление Потолком</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; margin: 5px; border-radius: 8px; font-size: 16px; cursor: pointer; }
        button:active { background: #0056b3; }
        .control-group { background: #1e1e1e; padding: 15px; margin: 15px 0; border-radius: 10px; }
        select, input[type=range] { width: 80%; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>

    <h1>Управление Потолком</h1>
    <button onclick="connectBLE()">Подключиться по Bluetooth</button>
    <p id="status">Статус: Отключено</p>

    <div class="control-group">
        <h3>Режим (0-9 Музыка, 10-29 Обычные)</h3>
        <input type="range" id="mode" min="0" max="29" value="0" onchange="sendVal('M', this.value)">
        <p>Выбран режим: <span id="modeNum">0</span></p>

        <h3>Подрежим (Вариация 0, 1, 2)</h3>
        <button onclick="sendVal('S', 0)">Подрежим 1</button>
        <button onclick="sendVal('S', 1)">Подрежим 2</button>
        <button onclick="sendVal('S', 2)">Подрежим 3</button>
    </div>

    <div class="control-group">
        <h3>Настройки</h3>
        <label>Яркость:</label><br>
        <input type="range" min="0" max="255" value="150" onchange="sendVal('B', this.value)"><br>

        <label>Чувствительность микрофона:</label><br>
        <input type="range" min="1" max="100" value="50" onchange="sendVal('G', this.value)"><br>

        <label>Палитра цветов:</label><br>
        <select onchange="sendVal('P', this.value)">
            <option value="0">Радуга</option>
            <option value="1">Полосатая Радуга</option>
            <option value="2">Океан</option>
            <option value="3">Облака</option>
            <option value="4">Лава</option>
            <option value="5">Вечеринка</option>
        </select>
    </div>

<script>
    const SERVICE_UUID = "4fa85f64-5715-4570-b02d-00986e314a6c";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    let bleCharacteristic = null;

    async function connectBLE() {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'ESP32_Ceiling_Light' }],
                optionalServices: [SERVICE_UUID]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
            document.getElementById('status').innerText = "Статус: Подключено!";
        } catch (error) {
            console.log(error);
            alert("Ошибка подключения по BLE: " + error);
        }
    }

    async function sendVal(prefix, val) {
        if (prefix === 'M') document.getElementById('modeNum').innerText = val;
        if (bleCharacteristic) {
            const data = new TextEncoder().encode(`${prefix}:${val}`);
            await bleCharacteristic.writeValue(data);
        }
    }
</script>
</body>
</html>
