<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление Потолком ESP32-S3</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121216; color: #eee; padding: 15px; max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 15px; font-size: 22px; }
        .main-btn { background: #007bff; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; margin-bottom: 15px; }
        #status { text-align: center; font-weight: bold; margin-bottom: 15px; color: #ff5555; }
        #status.connected { color: #00ff88; }
        .section { background: #1c1c24; padding: 15px; margin-bottom: 15px; border-radius: 12px; }
        .section h3 { border-bottom: 1px solid #333; padding-bottom: 6px; margin-bottom: 12px; font-size: 14px; color: #888; text-transform: uppercase; }
        
        /* Ползунки */
        .slider-group { margin-bottom: 12px; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
        input[type=range] { width: 100%; height: 6px; border-radius: 3px; background: #333; outline: none; -webkit-appearance: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #007bff; cursor: pointer; }

        /* Кнопки режимов */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
        .mode-btn { background: #282836; color: #ccc; border: 1px solid #3a3a4d; padding: 10px 5px; border-radius: 8px; font-size: 12px; cursor: pointer; text-align: center; }
        .mode-btn.active { background: #007bff; color: #fff; font-weight: bold; border-color: #0056b3; }

        /* Конструктор цвета */
        .color-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .color-item { display: flex; align-items: center; background: #2a2a38; padding: 4px 8px; border-radius: 6px; }
        .color-item input[type=color] { border: none; width: 28px; height: 28px; border-radius: 4px; background: none; cursor: pointer; }
        .color-item .remove-btn { background: #ff4444; color: white; border: none; width: 20px; height: 20px; border-radius: 50%; margin-left: 6px; cursor: pointer; font-size: 12px; }
        .add-color-btn { background: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        select { width: 100%; padding: 10px; background: #282836; color: #fff; border: 1px solid #3a3a4d; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>Управление Потолком</h1>
    <button class="main-btn" onclick="connectBLE()">Подключиться по BLE</button>
    <div id="status">Статус: Отключено</div>

    <!-- ПОЛЗУНКИ НАСТРОЕК -->
    <div class="section">
        <h3>Параметры и Плавность</h3>
        
        <div class="slider-group">
            <label>Яркость: <span id="valB">150</span></label>
            <input type="range" min="0" max="255" value="150" oninput="updateVal('B', this.value, 'valB')">
        </div>

        <div class="slider-group">
            <label>Чувствительность микрофона: <span id="valG">50</span></label>
            <input type="range" min="0" max="100" value="50" oninput="updateVal('G', this.value, 'valG')">
        </div>

        <div class="slider-group">
            <label>Скорость / Плавность эффектов: <span id="valV">50</span></label>
            <input type="range" min="1" max="100" value="50" oninput="updateVal('V', this.value, 'valV')">
        </div>

        <div class="slider-group">
            <label>Сглаживание шума / Аудио: <span id="valF">50</span></label>
            <input type="range" min="0" max="100" value="50" oninput="updateVal('F', this.value, 'valF')">
        </div>
    </div>

    <!-- КАСТОМНАЯ ПАЛИТРА -->
    <div class="section">
        <h3>Настройка Палитры</h3>
        <select onchange="sendVal('P', this.value)">
            <option value="0">Встроенная: Радуга</option>
            <option value="1">Встроенная: Полосы</option>
            <option value="2">Встроенная: Океан</option>
            <option value="3">Встроенная: Облака</option>
            <option value="4">Встроенная: Лава</option>
            <option value="5">Встроенная: Вечеринка</option>
            <option value="255" selected>Кастомная палитра</option>
        </select>

        <label style="font-size: 13px; color: #aaa; margin-bottom: 8px; display: block;">Свой набор цветов:</label>
        <div class="color-list" id="colorList"></div>
        <button class="add-color-btn" onclick="addColor('#ff0000')">+ Добавить цвет</button>
    </div>

    <!-- ВАРИАЦИИ -->
    <div class="section">
        <h3>Вариации режимов (Подрежимы)</h3>
        <div class="grid" style="grid-template-columns: repeat(3, 1fr);">
            <button class="mode-btn sub-btn active" onclick="setSub(0)">Вариант 1</button>
            <button class="mode-btn sub-btn" onclick="setSub(1)">Вариант 2</button>
            <button class="mode-btn sub-btn" onclick="setSub(2)">Вариант 3</button>
        </div>
    </div>

    <!-- РЕЖИМЫ -->
    <div class="section">
        <h3>🎵 Музыкальные Режимы (0-9)</h3>
        <div class="grid" id="musicModes"></div>
    </div>

    <div class="section">
        <h3>✨ Статические и Динамические Режимы (10-29)</h3>
        <div class="grid" id="staticModes"></div>
    </div>

<script>
    const SERVICE_UUID = "4fa85f64-5715-4570-b02d-00986e314a6c";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    let bleChar = null;

    let userColors = ['#ff0000', '#00ff00', '#0000ff'];

    const musicNames = ["1. Пик-Индикатор", "2. VU Центр", "3. Пульсация", "4. Бегущая волна", "5. Стробоскоп", "6. Огонь под звук", "7. С краев", "8. Вспышки", "9. Бегущая точка", "10. Спектрометр"];
    const staticNames = ["11. Статика Цвет", "12. Статика Градиент", "13. Теплый свет", "14. Бегущая палитра", "15. Дыхание", "16. Огонь", "17. Плазма", "18. Комета", "19. Блики", "20. Конфетти", "21. Бегущие точки", "22. Смещение", "23. Звезды", "24. Синус волны", "25. Двухцветный", "26. Рыцарь дорог", "27. Лава-лампа", "28. Чередование", "29. Смена цвета", "30. Импульсы"];

    function initUI() {
        const mContainer = document.getElementById('musicModes');
        musicNames.forEach((name, idx) => {
            mContainer.innerHTML += `<button class="mode-btn m-btn ${idx===0?'active':''}" onclick="setMode(${idx})">${name}</button>`;
        });

        const sContainer = document.getElementById('staticModes');
        staticNames.forEach((name, idx) => {
            sContainer.innerHTML += `<button class="mode-btn m-btn" onclick="setMode(${idx+10})">${name}</button>`;
        });

        renderColors();
    }

    async function connectBLE() {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'ESP32_Ceiling_Light' }],
                optionalServices: [SERVICE_UUID]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            bleChar = await service.getCharacteristic(CHARACTERISTIC_UUID);
            
            document.getElementById('status').innerText = "Статус: Подключено!";
            document.getElementById('status').classList.add('connected');
            sendCustomColors();
        } catch (e) {
            alert("Ошибка BLE: " + e);
        }
    }

    async function sendVal(prefix, val) {
        if (bleChar) {
            try {
                await bleChar.writeValue(new TextEncoder().encode(`${prefix}:${val}`));
            } catch(e) { console.error(e); }
        }
    }

    function updateVal(prefix, val, labelId) {
        document.getElementById(labelId).innerText = val;
        sendVal(prefix, val);
    }

    function setMode(idx) {
        document.querySelectorAll('.m-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
        sendVal('M', idx);
    }

    function setSub(idx) {
        document.querySelectorAll('.sub-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
        sendVal('S', idx);
    }

    function renderColors() {
        const list = document.getElementById('colorList');
        list.innerHTML = '';
        userColors.forEach((hex, idx) => {
            list.innerHTML += `
                <div class="color-item">
                    <input type="color" value="${hex}" onchange="changeColor(${idx}, this.value)">
                    ${userColors.length > 1 ? `<button class="remove-btn" onclick="removeColor(${idx})">×</button>` : ''}
                </div>
            `;
        });
    }

    function addColor(hex) {
        if(userColors.length < 16) {
            userColors.push(hex);
            renderColors();
            sendCustomColors();
        }
    }

    function removeColor(idx) {
        if(userColors.length > 1) {
            userColors.splice(idx, 1);
            renderColors();
            sendCustomColors();
        }
    }

    function changeColor(idx, hex) {
        userColors[idx] = hex;
        sendCustomColors();
    }

    function sendCustomColors() {
        let payload = userColors.map(hex => {
            let r = parseInt(hex.substring(1,3), 16);
            let g = parseInt(hex.substring(3,5), 16);
            let b = parseInt(hex.substring(5,7), 16);
            return `${r},${g},${b}`;
        }).join(';');
        
        sendVal('C', payload);
    }

    initUI();
</script>
</body>
</html>
