<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления Светомузыкой BLE</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; color: #ffffff; font-weight: 400; margin-bottom: 20px; }
        .section { margin-bottom: 20px; border-bottom: 1px solid #2d2d2d; padding-bottom: 15px; }
        .section:last-child { border-bottom: none; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaaaaa; }
        input[type="range"], select {
            width: 100%;
            box-sizing: border-box;
            background: #2a2a2a;
            border: 1px solid #3d3d3d;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        input[type="color"] {
            width: 100%; height: 40px; border: none; background: transparent; cursor: pointer;
        }
        .btn-connect {
            width: 100%;
            padding: 12px;
            background: #0076ff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-connect:hover { background: #0056b3; }
        .status { text-align: center; font-size: 12px; margin-top: 10px; color: #ff5555; }
        .connected { color: #55ff55; }
    </style>
</head>
<body>

<div class="container">
    <h2>Светомузыка BLE</h2>
    
    <div class="section">
        <button class="btn-connect" onclick="connectBLE()">Подключить Bluetooth</button>
        <div id="status" class="status">Устройство не подключено</div>
    </div>

    <div class="section">
        <label>Режим анимации:</label>
        <select id="mode" onchange="sendData()">
            <option value="0">Статичный цвет</option>
            <option value="1">Пульсация (Громкость)</option>
            <option value="2">Бегущая волна из центра</option>
            <option value="3">Динамическая радуга</option>
        </select>
    </div>

    <div class="section">
        <label>Кастомный цвет режима:</label>
        <input type="color" id="colorPicker" value="#ff0096" oninput="sendData()">
    </div>

    <div class="section">
        <label>Яркость ленты:</label>
        <input type="range" id="brightness" min="0" max="255" value="128" oninput="sendData()">
        
        <label>Чувствительность микрофона:</label>
        <input type="range" id="sensitivity" min="1" max="100" value="50" oninput="sendData()">
        
        <label>Задержка шага (Скорость):</label>
        <input type="range" id="speed" min="5" max="100" value="30" oninput="sendData()">
    </div>
</div>

<script>
    const SERVICE_UUID = "4faac861-6a92-4d43-99fc-157d1925c223";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    
    let bleCharacteristic = null;

    async function connectBLE() {
        try {
            document.getElementById('status').innerText = "Поиск устройства...";
            
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'ESP32_Music_LED' }],
                optionalServices: [SERVICE_UUID]
            });

            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            document.getElementById('status').innerText = "Подключено к ESP32";
            document.getElementById('status').className = "status connected";
            
            device.addEventListener('gattserverdisconnected', () => {
                document.getElementById('status').innerText = "Соединение разорвано";
                document.getElementById('status').className = "status";
                bleCharacteristic = null;
            });

        } catch (error) {
            console.log(error);
            document.getElementById('status').innerText = "Ошибка подключения";
            document.getElementById('status').className = "status";
        }
    }

    async function sendData() {
        if (!bleCharacteristic) return;

        const hexColor = document.getElementById('colorPicker').value;
        const r = parseInt(hexColor.substr(1,2), 16);
        const g = parseInt(hexColor.substr(3,2), 16);
        const b = parseInt(hexColor.substr(5,2), 16);

        const data = {
            mode: parseInt(document.getElementById('mode').value),
            brightness: parseInt(document.getElementById('brightness').value),
            sensitivity: parseInt(document.getElementById('sensitivity').value),
            speed: parseInt(document.getElementById('speed').value),
            r: r, g: g, b: b
        };

        const jsonString = JSON.stringify(data);
        const encoder = new TextEncoder();
        const buffer = encoder.encode(jsonString);

        try {
            // Отправляем массив байт по BLE
            await bleCharacteristic.writeValue(buffer);
        } catch (error) {
            console.error("Ошибка отправки:", error);
        }
    }
</script>
</body>
</html>
