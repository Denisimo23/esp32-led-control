[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3 Super Mini обычно 4 МБ flash.
; Если у тебя 8/16 МБ — поменяй на 8MB/16MB.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    fastled/FastLED@^3.9.0

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LED_PIN=5
    -D NUM_LEDS=144
    -D MIC_PIN=4
    -D MAX_MILLIAMPS=4000

; Цифровой микрофон INMP441.
; Прошей этот env, если у тебя не аналоговый модуль, а I2S-микрофон.
[env:esp32s3-i2s]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -D MIC_I2S=1
    -D I2S_SCK=15
    -D I2S_WS=16
    -D I2S_SD=17
